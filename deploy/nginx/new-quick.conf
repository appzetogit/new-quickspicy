# Quick Spicy web app + API. Installed as /etc/nginx/sites-available/new-quick.conf.
#
# HTTP only on purpose: certbot (`certbot --nginx -d new.quickspicy.in -d
# api-new.quickspicy.in`) adds the 443 blocks and redirects on the server and
# rewrites them on renewal, so a second copy here would drift.

# new.quickspicy.in -- the SPA build
server {
  listen 80;
  listen [::]:80;
  server_name new.quickspicy.in;
  root /srv/new-quick/web;
  index index.html;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; }
}

# api-new.quickspicy.in -- API (5100), Socket.IO (5101), uploads
server {
  listen 80;
  listen [::]:80;
  server_name api-new.quickspicy.in;
  client_max_body_size 10m;

  location /uploads/ {
    alias /var/www/new-quick-uploads/;
    expires 30d;
    access_log off;
  }

  location /socket.io/ {
    proxy_pass http://127.0.0.1:5101;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://127.0.0.1:5100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
